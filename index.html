<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="María Guerrero, diseñadora de modas en Metepec, Estado de México. Vestidos de noche, novia, XV años y sastrería a la medida.">
<meta property="og:title" content="María Guerrero · Diseñadora de modas">
<meta property="og:description" content="Vestidos de noche, novia y sastrería hechos a tu medida.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>María Guerrero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Pinyon+Script&family=Jost:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style id="css">
/* Layout: mesa de patronaje — papel punteado, cinta métrica como separador, galería en rejilla */
:root{
  --paper:#F4F5F2; --card:#FFFFFF; --ink:#24192A; --muted:#6B6170; --line:#DDDAD8;
  --chalk:#2C43B0; --chalk-soft:#E4E8F8; --rose:#A9566E; --tape:#E8CF6E; --tape-ink:#3A2F12;
  --ok:#2E7D4F; --warn:#A86A12; --violet:#6A44A8; --danger:#B3261E;
  --script:"Pinyon Script","Snell Roundhand","Edwardian Script ITC","Brush Script MT",cursive;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Century Gothic","Segoe UI",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16131A; --card:#201B25; --ink:#EFE9F1; --muted:#A99FAF; --line:#3A3341;
  --chalk:#9AACFF; --chalk-soft:#262C4A; --rose:#E59AB0; --tape:#C9B25C; --tape-ink:#221B07;
  --ok:#6FCB94; --warn:#E5AE5A; --violet:#BBA0F0; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16131A; --card:#201B25; --ink:#EFE9F1; --muted:#A99FAF; --line:#3A3341;
  --chalk:#9AACFF; --chalk-soft:#262C4A; --rose:#E59AB0; --tape:#C9B25C; --tape-ink:#221B07;
  --ok:#6FCB94; --warn:#E5AE5A; --violet:#BBA0F0; --danger:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.2px);background-size:22px 22px}
a{color:var(--chalk)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;line-height:1.05;margin:0}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:11px 20px;border-radius:999px;cursor:pointer;text-decoration:none;font-weight:500;font-size:15.5px;line-height:1.2}
.btn:hover{background:var(--chalk);border-color:var(--chalk)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--chalk-soft);color:var(--ink);border-color:var(--chalk)}
.btn.small{padding:7px 14px;font-size:14px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}

/* Barra de la dueña */
.owner{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--paper)}
.owner .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:8px}
.owner .who{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-right:auto}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{background:transparent;border:1px solid transparent;color:var(--paper);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14.5px}
.tab[aria-current="true"]{background:var(--paper);color:var(--ink)}
.tab:hover{border-color:color-mix(in srgb,var(--paper) 50%,transparent)}

/* Cabecera pública */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.mono{width:44px;height:44px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:18px;letter-spacing:-.04em;flex:none}
.mark .n{font-family:var(--script);font-size:30px;line-height:1}
.mark .o{display:block;font-family:var(--display);font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.nav{display:flex;gap:22px;flex-wrap:wrap}
.nav a{color:var(--ink);text-decoration:none;font-size:15.5px}
.nav a:hover{color:var(--chalk)}

.hero{display:block;padding-block:12px 40px}
.portada{position:relative;border-radius:var(--r);overflow:hidden;min-height:560px;display:flex;align-items:center;padding:48px clamp(24px,5vw,64px);background:#F6ECE4;color:#2A1A26;--ink:#2A1A26;--muted:#6E5A63;--paper:#FFF8F2;--chalk:#6A2848;--chalk-soft:#F3E2E6}
.portada .fondo{position:absolute;inset:0 0 0 auto;height:100%;width:min(62%,720px);object-fit:cover;object-position:center top;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 34%);mask-image:linear-gradient(to right,transparent 0,#000 34%)}
.portada .texto{position:relative;max-width:520px;min-width:0}
.portada .texto::before{content:"";position:absolute;inset:-30px -60px -30px -40px;background:radial-gradient(closest-side,rgba(246,236,228,.85),rgba(246,236,228,0));z-index:-1}
.hero h1{font-family:var(--script);font-weight:400;font-size:clamp(4rem,11.5vw,8.6rem);line-height:1.08;letter-spacing:0;margin:6px 0 0;padding-bottom:.08em}
.hero h1 .ap{display:block;padding-left:.9em}
.oficio{display:flex;align-items:center;gap:16px;font-family:var(--display);font-size:clamp(.82rem,1.6vw,1rem);letter-spacing:.42em;text-transform:uppercase;margin:8px 0 26px;color:var(--ink)}
.oficio::before,.oficio::after{content:"";height:1px;background:var(--ink);flex:0 0 38px}
.oficio::after{flex:1 1 auto;max-width:120px}
.ciudad{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero p.lead{font-size:20px;max-width:34ch;color:var(--ink);margin:0 0 28px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero-fig{align-self:stretch;align-content:center;position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 14px;display:grid;grid-template-columns:28px 1fr;gap:10px}
.hero-fig .regla{background:var(--tape);border-radius:2px;position:relative;
  background-image:repeating-linear-gradient(to bottom,var(--tape-ink) 0 1px,transparent 1px 8px);background-size:7px 100%;background-repeat:repeat-y}
.hero-fig .regla span{position:absolute;left:12px;font-family:var(--mono);font-size:9.5px;color:var(--tape-ink);transform:translateY(-50%)}
.hero-fig svg{width:auto;height:min(460px,70vw);display:block}
.hero-fig .lamina img{width:100%;height:100%;object-fit:cover;display:block}
.hero-fig figcaption{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.hero-fig figcaption b{color:var(--ink);font-weight:500}

/* Cinta métrica */
.cinta{height:34px;background:var(--tape);color:var(--tape-ink);position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(to right,var(--tape-ink) 0 1px,transparent 1px 8px),repeating-linear-gradient(to right,var(--tape-ink) 0 1px,transparent 1px 40px);
  background-size:100% 7px,100% 13px;background-repeat:no-repeat;box-shadow:0 1px 0 color-mix(in srgb,var(--tape-ink) 25%,transparent)}
.cinta span{position:absolute;bottom:3px;font-family:var(--mono);font-size:10.5px;transform:translateX(-50%)}

section{padding-block:64px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font-size:clamp(2.2rem,5vw,3.4rem)}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.pieza{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pieza .img{aspect-ratio:6/5;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.pieza .img img{width:100%;height:100%;object-fit:cover;object-position:center 12%}
.pieza .img svg{height:96%;width:auto}
.pieza .tag{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--card);border:1px solid var(--line);padding:2px 8px;border-radius:999px;color:var(--muted)}
.pieza .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.pieza h3{font-size:24px}
.pieza .meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.pieza .meta .precio{font-family:var(--mono);color:var(--ink)}
.pieza p{margin:0;font-size:15.5px;flex:1}
.pieza .btn{align-self:flex-start;margin-top:8px}

.proceso{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--ink)}
.paso{padding:20px 22px 8px 0;border-right:1px solid var(--line);margin-right:22px}
.paso:last-child{border-right:0;margin-right:0}
.paso .n{font-family:var(--mono);font-size:13px;color:var(--chalk)}
.paso h3{font-size:25px;margin:8px 0 8px}
.paso p{margin:0;font-size:15.5px;color:var(--muted)}

.contacto{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo.full{grid-column:1/-1}
.campo label{font-size:14px;font-weight:500}
.campo input,.campo select,.campo textarea{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:10px 12px;width:100%;min-width:0}
.campo textarea{min-height:96px;resize:vertical}
.campo .hint{font-size:13px;color:var(--muted)}
.form .acciones{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.resultado{grid-column:1/-1;border:1px dashed var(--chalk);background:var(--chalk-soft);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:10px}
.resultado pre{white-space:pre-wrap;font-family:var(--mono);font-size:13.5px;margin:0;user-select:all}
.canales{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--ink)}
.canal{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.canal .k{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.canal .v{font-size:17px;overflow-wrap:anywhere;user-select:all}
.falta{color:var(--warn);font-size:14.5px}
footer .n{font-family:var(--script);font-size:28px;color:var(--ink);line-height:1}
footer{align-items:center;padding-block:36px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line)}

/* Panel de trabajo */
.panel{padding-block:32px 64px}
.panel h2{font-size:clamp(2rem,4.4vw,2.9rem)}
.resumen{display:flex;gap:10px;flex-wrap:wrap;margin-block:18px}
.est{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.est[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.est b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.d-Prospecto{background:var(--muted)} .d-Cita{background:var(--chalk)} .d-Confeccion{background:var(--warn)} .d-Pruebas{background:var(--violet)} .d-Entregado{background:var(--ok)}
.herr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.herr input[type=search]{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px}
.tabla-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
th{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--chalk-soft)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
.vacio{padding:40px 24px;text-align:center;color:var(--muted)}
.vacio h3{color:var(--ink);font-size:26px;margin-bottom:8px}
.ficha{background:var(--card);border:1px solid var(--ink);border-radius:var(--r);padding:24px;margin-bottom:22px}
.ficha .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ficha h3{font-size:28px;margin-bottom:16px}
.ficha fieldset{border:1px dashed var(--line);border-radius:4px;padding:14px;margin:16px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ficha legend{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-inline:6px}
.ficha .acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.ficha .acciones .der{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:15px;z-index:50;max-width:calc(100% - 32px)}
.nota{background:var(--chalk-soft);border-radius:var(--r);padding:14px 16px;font-size:15px;margin-bottom:18px}
.nota b{font-weight:600}

.editor{display:grid;gap:18px}
.bloque{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.bloque h3{font-size:26px;margin-bottom:14px}
.bloque .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.disenos-ed{display:grid;gap:14px}
.d-ed{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper)}
.d-ed .mini{aspect-ratio:4/5;border-radius:4px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.d-ed .mini img{width:100%;height:100%;object-fit:cover}
.d-ed .mini svg{height:92%;width:auto}
.d-ed .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.d-ed .ops{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.d-ed input[type=color]{height:42px;padding:3px;cursor:pointer}
.barra-pub{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.barra-pub .estado{color:var(--muted);font-size:14.5px;margin-right:auto}

@media (max-width:860px){
  .hero,.contacto{grid-template-columns:1fr}
  .portada{min-height:0;flex-direction:column;align-items:stretch;padding:28px 22px 0}
  .portada .fondo{position:relative;width:100%;height:340px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%);mask-image:linear-gradient(to bottom,transparent 0,#000 22%);margin-top:-10px}
  .portada .texto::before{display:none}
  .proceso{grid-template-columns:1fr 1fr}
  .paso:nth-child(2){border-right:0;margin-right:0}
  .ficha .grid{grid-template-columns:1fr 1fr}
  .ficha fieldset{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px){
  body{font-size:16px}
  .form,.bloque .grid,.ficha .grid,.d-ed .grid{grid-template-columns:1fr}
  .proceso{grid-template-columns:1fr}
  .paso{border-right:0;margin-right:0;border-bottom:1px solid var(--line);padding-bottom:18px}
  .ficha fieldset{grid-template-columns:1fr 1fr}
  .d-ed{grid-template-columns:1fr}
  .d-ed .mini{max-width:160px}
  .canal{grid-template-columns:1fr auto}
  .canal .k{grid-column:1/-1}
  .nav{gap:14px}
}
@media (prefers-reduced-motion:no-preference){
  .pieza{transition:transform .25s ease,box-shadow .25s ease}
  .pieza:hover{transform:translateY(-3px);box-shadow:0 10px 24px color-mix(in srgb,var(--ink) 12%,transparent)}
}
</style>
</head>

function prepararMensaje(){

  var out = XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{ await descargas.save({filename:"Clientes_MariaGuerrero.xlsx",data:new Uint8Array(out)}); aviso("Excel descargado. Ahora ejecuta ActualizarClientes en tu PC."); }
  catch(e){ if(e&&e.code==="declined") return; aviso(e&&e.code==="rate_limited"?"Ya hay una descarga pendiente de confirmar.":"No se pudo descargar el archivo."); }
}

/* ---------- Editar sitio (solo la dueña) ---------- */
function vistaEditar(){
  var c=borrador.config;
  var h='<div class="wrap panel"><div class="sec-head"><div><div class="eyebrow">Solo visible para ti</div><h2>Editar sitio</h2><p>Cambia tus datos de contacto y tus diseños. Los cambios se ven en el sitio público cuando pulsas Publicar cambios.</p></div></div>';
  if(!artCap) h+='<div class="nota"><b>No puedes publicar desde esta vista.</b> Abre la página desde tu cuenta de Claude como dueña para guardar cambios.</div>';
  h+='<div class="editor"><div class="bloque"><h3>Tus datos</h3><div class="grid">'+
   cfg("marca","Nombre que aparece en el sitio")+cfg("oficio","Oficio")+cfg("whatsapp","WhatsApp (10 dígitos)","tel")+cfg("correo","Correo de contacto","email")+cfg("instagram","Instagram (usuario)")+cfg("ciudad","Ciudad del taller")+cfg("horario","Horario")+
   '<div class="campo"><label for="cfg-portada">Imagen de portada</label><input id="cfg-portada" type="file" accept="image/*" data-portada="1">'+(c.portada?'<button class="btn ghost small" data-act="quitarPortada" style="align-self:flex-start">Quitar imagen de portada</button>':'')+'</div>'+'<div class="campo full"><label for="cfg-frase">Frase de presentación</label><textarea id="cfg-frase" data-cfg="frase">'+esc(c.frase)+'</textarea></div></div></div>'+
   '<div class="bloque"><div class="sec-head" style="margin-bottom:14px"><h3 style="margin:0">Diseños</h3><button class="btn ghost small" data-act="agregarDiseno">Agregar diseño</button></div><p style="margin:0 0 14px;color:var(--muted);font-size:15px">El primer diseño es el que aparece primero en la galería. Sube una foto para reemplazar la ilustración; se reduce automáticamente.</p><div class="disenos-ed">'+
   borrador.disenos.map(function(d,i){ return '<div class="d-ed"><div><div class="mini" style="'+fondoDiseno(d)+'">'+imagenDiseno(d)+'</div></div><div><div class="grid">'+
     dcampo(i,"nombre","Nombre",d.nombre)+dcampo(i,"coleccion","Colección",d.coleccion)+dcampo(i,"precio","Precio",d.precio)+
     '<div class="campo"><label for="d'+i+'-tipo">Silueta</label><select id="d'+i+'-tipo" data-d="'+i+'" data-k="tipo" data-redibuja="1">'+TIPOS.map(function(t){return '<option value="'+t[0]+'"'+(d.tipo===t[0]?' selected':'')+'>'+t[1]+'</option>';}).join("")+'</select></div>'+
     '<div class="campo"><label for="d'+i+'-color">Color</label><input id="d'+i+'-color" type="color" value="'+esc(d.color||"#7A2E4A")+'" data-d="'+i+'" data-k="color" data-redibuja="1"></div>'+
     '<div class="campo"><label for="d'+i+'-foto">Foto</label><input id="d'+i+'-foto" type="file" accept="image/*" data-foto="'+i+'"></div>'+
     '<div class="campo full" style="grid-column:1/-1"><label for="d'+i+'-descripcion">Descripción</label><textarea id="d'+i+'-descripcion" data-d="'+i+'" data-k="descripcion" style="min-height:64px">'+esc(d.descripcion)+'</textarea></div></div>'+
     '<div class="ops">'+(i>0?'<button class="btn ghost small" data-act="subir" data-v="'+i+'">Subir</button>':'')+(i<borrador.disenos.length-1?'<button class="btn ghost small" data-act="bajar" data-v="'+i+'">Bajar</button>':'')+
     (d.foto?'<button class="btn ghost small" data-act="quitarFoto" data-v="'+i+'">Quitar foto</button>':'')+
     (d.ejemplo?'<span style="font-size:13.5px;color:var(--muted)">Marcado como ejemplo · se quita al editarlo</span>':'')+
     '<button class="btn ghost small" data-act="eliminarDiseno" data-v="'+i+'" style="margin-left:auto">Eliminar</button></div></div></div>'; }).join("")+'</div></div></div>'+
   '<div class="barra-pub"><span class="estado" id="estadoPub">'+(cambios?'Tienes cambios sin publicar.':'Sin cambios pendientes.')+'</span><button class="btn ghost" data-act="descartar"'+(cambios?'':' disabled')+'>Descartar</button><button class="btn" data-act="publicar"'+(cambios&&artCap?'':' disabled')+' id="btnPublicar">Publicar cambios</button></div></div>';
  return h;
}
function cfg(k,etq,tipo){ return '<div class="campo"><label for="cfg-'+k+'">'+etq+'</label><input id="cfg-'+k+'" type="'+(tipo||"text")+'" data-cfg="'+k+'" value="'+esc(borrador.config[k])+'"></div>'; }
function dcampo(i,k,etq,val){ return '<div class="campo"><label for="d'+i+'-'+k+'">'+etq+'</label><input id="d'+i+'-'+k+'" data-d="'+i+'" data-k="'+k+'" value="'+esc(val)+'"></div>'; }
function marcarCambio(){ cambios=true; var e=document.getElementById("estadoPub"); if(e) e.textContent="Tienes cambios sin publicar."; var b=document.getElementById("btnPublicar"); if(b) b.disabled=!artCap; var d=document.querySelector('[data-act="descartar"]'); if(d) d.disabled=false; }
function cargarFoto(i,file){
  if(!file) return; var fr=new FileReader();
  fr.onload=function(){ var img=new Image(); img.onload=function(){ var max=i<0?1400:900, w=img.width, h=img.height, k=Math.min(1,max/Math.max(w,h)); var cv=document.createElement("canvas"); cv.width=Math.round(w*k); cv.height=Math.round(h*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    var url=cv.toDataURL("image/jpeg",0.82); if(i<0){ borrador.config.portada=url; } else { borrador.disenos[i].foto=url; borrador.disenos[i].ejemplo=false; } marcarCambio(); render(); aviso("Foto agregada. Publica para que se vea en el sitio."); };
    img.onerror=function(){aviso("No se pudo leer esa imagen. Prueba con un JPG o PNG.");}; img.src=fr.result; };
  fr.readAsDataURL(file);
}
function construirDocumento(st){
  var css=document.getElementById("css").textContent, main=document.getElementById("main").textContent;
  var json=JSON.stringify(st).replace(/</g,"\\u003c");
  return SKELETON+'<title>'+esc(st.config.marca||"María Guerrero")+'</title>\n'+FUENTES+'\n<style id="css">'+css+'</style>\n<div id="app"></div>\n<script type="application/json" id="estado">'+json+'<\/script>\n<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>\n<script id="main">'+main+'<\/script></body></html>';
}
async function publicar(){
  if(!artCap) return; var b=document.getElementById("btnPublicar"); if(b){b.disabled=true;b.textContent="Publicando…";}
  borrador.config.whatsapp=soloDigitos(borrador.config.whatsapp);
  try{ await artCap.publish(construirDocumento(borrador)); aviso("Publicado. La página se recargará con tus cambios."); }
  catch(e){ if(b){b.disabled=false;b.textContent="Publicar cambios";}
    aviso(e&&e.code==="conflict"?"Se guardó otra versión al mismo tiempo; la página se recargará.":(e&&(e.code==="not_granted"||e.code==="not_writer"))?"Solo la dueña puede publicar cambios.":"No se pudo publicar. Inténtalo de nuevo."); }
}

/* ---------- Render y eventos ---------- */
function barraDuena(){ if(!esDuena) return ""; var t=[["publico","Sitio público"],["directorio","Directorio de clientes"],["editar","Editar sitio"]];
  return '<div class="owner"><div class="wrap"><span class="who">Panel de María</span><nav class="tabs" aria-label="Panel">'+t.map(function(x){return '<button class="tab" data-act="vista" data-v="'+x[0]+'" aria-current="'+(vista===x[0])+'">'+x[1]+'</button>';}).join("")+'</nav></div></div>'; }
function render(){
  var y=window.scrollY;
  app.innerHTML = barraDuena() + (vista==="directorio"?vistaDirectorio():vista==="editar"?vistaEditar():vistaPublica());
  if(vista==="directorio"){ pintarResumen(); pintarTabla(); }
  if(vista==="editar") window.scrollTo(0,y);
}
app.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]"); if(!t) return; var a=t.getAttribute("data-act"), v=t.getAttribute("data-v");
  if(a==="col"){ filtroCol=v; render(); document.getElementById("disenos").scrollIntoView({block:"start"}); }
  else if(a==="interes"){ prendaElegida=v; var s=document.getElementById("c-prenda"); if(s) s.value=v; document.getElementById("contacto").scrollIntoView({behavior:"smooth"}); var n=document.getElementById("c-nombre"); if(n) setTimeout(function(){n.focus({preventScroll:true});},450); }
  else if(a==="copiar"){ ev.preventDefault(); try{ navigator.clipboard.writeText(v).then(function(){aviso("Copiado");},function(){aviso("Selecciona el texto y cópialo.");}); }catch(e){ aviso("Selecciona el texto y cópialo."); } }
  else if(a==="vista"){ vista=v; editando=null; render(); window.scrollTo(0,0); }
  else if(a==="nuevo") abrirFicha("nuevo");
  else if(a==="editar") abrirFicha(v);
  else if(a==="cerrar") cerrarFicha();
  else if(a==="guardar") guardarCliente();
  else if(a==="borrar"){ confirmaBorrar=true; document.getElementById("fichaZona").innerHTML=ficha(); }
  else if(a==="borrarNo"){ confirmaBorrar=false; document.getElementById("fichaZona").innerHTML=ficha(); }
  else if(a==="borrarSi") borrarCliente();
  else if(a==="filtroEst"){ filtroEst=v; pintarResumen(); pintarTabla(); }
  else if(a==="exportar") exportar();
  else if(a==="agregarDiseno"){ borrador.disenos.push({id:"d"+Date.now(),nombre:"Diseño nuevo",coleccion:"Noche",tipo:"vestido-largo",color:"#7A2E4A",precio:"",descripcion:"",foto:"",ejemplo:false}); marcarCambio(); render(); }
  else if(a==="eliminarDiseno"){ borrador.disenos.splice(+v,1); marcarCambio(); render(); }
  else if(a==="subir"||a==="bajar"){ var i=+v, j=a==="subir"?i-1:i+1, ds=borrador.disenos, tmp=ds[i]; ds[i]=ds[j]; ds[j]=tmp; marcarCambio(); render(); }
  else if(a==="quitarPortada"){ borrador.config.portada=""; marcarCambio(); render(); }
  else if(a==="quitarFoto"){ borrador.disenos[+v].foto=""; marcarCambio(); render(); }
  else if(a==="descartar"){ borrador=JSON.parse(JSON.stringify(estado)); cambios=false; render(); }
  else if(a==="publicar") publicar();
});
app.addEventListener("keydown",function(ev){ if(ev.key==="Enter"){ var r=ev.target.closest('tr[data-act="editar"]'); if(r) abrirFicha(r.getAttribute("data-v")); } });
app.addEventListener("submit",function(ev){ if(ev.target.id==="formContacto"){ ev.preventDefault(); prepararMensaje(); } });
app.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="busca"){ busqueda=t.value; pintarTabla(); return; }
  if(t.hasAttribute("data-cfg")){ borrador.config[t.getAttribute("data-cfg")]=t.value; marcarCambio(); return; }
  if(t.hasAttribute("data-d")){ var d=borrador.disenos[+t.getAttribute("data-d")]; d[t.getAttribute("data-k")]=t.value; if(d.ejemplo){d.ejemplo=false;} marcarCambio();
    if(t.hasAttribute("data-redibuja") && !d.foto){ var box=t.closest(".d-ed").querySelector(".mini"); box.innerHTML=figura(d.tipo,d.color); box.setAttribute("style",fondoDiseno(d)); } }
});
app.addEventListener("change",function(ev){ var t=ev.target; if(t.hasAttribute("data-foto")) cargarFoto(+t.getAttribute("data-foto"),t.files&&t.files[0]); if(t.hasAttribute("data-portada")) cargarFoto(-1,t.files&&t.files[0]); });

render();

/* Capacidades: solo la dueña ve el panel */
(async function(){
  if(!window.claude || !window.claude.use) return;
  try{
    var user = await window.claude.use("user");
    esDuena = user ? await user.isOwner() : false;
    if(!esDuena) return;
    var r = await Promise.all([window.claude.use("db"),window.claude.use("downloads"),window.claude.use("artifact")]);
    db=r[0]; descargas=r[1]; artCap=r[2];
    if(db){ db.collection("clientes").onSnapshot(function(snap){ clientes=snap.docs.map(function(d){var o=Object.assign({},d.data()); o.id=d.id; return o;}); clientesListo=true; errorClientes=""; if(vista==="directorio"){ pintarResumen(); pintarTabla(); } },
      function(e){ errorClientes = e&&e.code==="revoked"?"Tu acceso cambió; recarga la página.":"Recarga la página para intentarlo de nuevo."; if(vista==="directorio") pintarTabla(); }); }
    render();
  }catch(e){}
})();
})();
</script>
